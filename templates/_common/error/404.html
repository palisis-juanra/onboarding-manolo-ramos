<!DOCTYPE html>
<html lang="en">
{{> _partials/_header }}
<body class="h-screen w-screen flex justify-center items-center">
	<main>
		<div id="logoutMessage" class="text-gray-700 text-2xl font-bold">
			<p class="text-center pb-2 text-4xl">Oops...</p> 
			<p class="text-center">Something weird happened</p>
			<br>
		</div>
		<div class="text-gray-700 text-center text-1xl">
			<p class="text-center">You can get more info about the error below 👇</p>
			{{# errorMessage}}
				<pre class="pt-3 pb-10 text-center">{{errorMessage}} 🚨</pre>
			{{/ errorMessage}}
			{{^ errorMessage}}
				<pre class="text-center pt-3 pb-10">Invalid URL or unknown error 🚫</pre>
			{{/ errorMessage}}
			<a class="italic hover:underline" href="{{BASE_URL}}/login/">>_ Take me back to the login page</a>
		</div>
	</main>
	{{> _partials/_footer }}
</body>
</html>
