<!DOCTYPE html>
<html lang="en">
{{> _partials/_header }}
<body class="h-screen w-screen flex justify-center items-center bg-gray-100">
	<main>
		<h1 class="text-4xl font-bold text-gray-900 text-center mb-10">
			Log in
		</h1>
		<div class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4 w-full max-w-md">
			<form action="{{BASE_URL}}/login/loginAction" method="post">
				<div class="mb-4">
					<label class="block text-gray-700 font-bold mb-2" for="username">
						Username
					</label>
					<input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="username" type="text" value="admin" required>
				</div>
				<div class="mb-6">
					<label class="block text-gray-700 font-bold mb-2" for="password">
						Password
					</label>
					<input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="password" type="password" value="admin" required>
				</div>
				<div class="flex items-center justify-center">
					<button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
					Submit
					</button>
				</div>
			</form>
		</div>
	</main>
	{{> _partials/_footer }}
</body>
</html>
