<!DOCTYPE html>
<html lang="en">
{{> _partials/_header }}
<body class="h-screen w-screen flex justify-center items-center">
	<main class="h-screen">
		<div style="margin-top: 10%; padding-bottom: 10%;" class="container mx-auto my-10">
			<h1 class="text-4xl font-bold text-gray-900 text-center mb-10">
				Tour List
			</h1>
			<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
				{{# templateData}}
					<div class="bg-white shadow-md rounded-lg overflow-hidden">
						<div class="h-48 overflow-hidden">
							<img src="{{thumbnailImage}}" alt="Card Image" class="w-full h-full object-cover">
						</div>
						<div class="p-4">
							<h3 class="text-lg font-bold mb-2">{{tourName}}</h3>
							<p class="text-gray-600 mb-4">{{tourCode}}</p>
							<div class="flex justify-between items-center">
							<button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
								Button
							</button>
							<div class="flex space-x-2">
								<svg class="h-6 w-6 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z" />
								</svg>
								<svg class="h-6 w-6 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
								</svg>
								<svg class="h-6 w-6 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
								</svg>
							</div>
							</div>
						</div>
					</div>
				{{/ templateData}}
			</div>
		</div>
	</main>
	{{> _partials/_footer }}
</body>
</html>
